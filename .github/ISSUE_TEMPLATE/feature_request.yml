name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: contracts
    attributes:
      label: Does this touch a public contract?
      description: The embed URL shape, the resizer path, the embed.js message protocol, or content ids. See "Public contracts" in README.md.
      options:
        - "No"
        - "Yes, and the migration path is described above"
        - "Not sure"
    validations:
      required: true
