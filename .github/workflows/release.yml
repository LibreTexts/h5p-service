name: Release New Version

on: workflow_dispatch

concurrency:
  group: release
  cancel-in-progress: false

# The release itself authenticates with LIBREBOT_ACCESS_TOKEN, not with
# GITHUB_TOKEN, so that the tag and the CHANGELOG commit can pass a protected
# main. These permissions only scope the automatic GITHUB_TOKEN; contents:
# write is kept so nothing here depends on the repository default.
permissions:
  contents: write

jobs:
  check_authorization:
    name: Check authorization to release new version
    runs-on: ubuntu-latest
    steps:
      # Fails the run rather than reporting an unauthorized outcome the
      # dependent job then skips on. A skipped job leaves the whole run green,
      # so an unconfigured or refused release would look like a successful one
      # that happened to publish nothing.
      - name: Check authorization
        env:
          # Via env, not interpolated into the script. A secret expanded inline
          # becomes part of the shell source, so its contents would execute.
          AUTHORIZED_USERS: ${{ secrets.DEPLOYMENT_AUTHORIZED_USERS }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          actor="$(printf '%s' "$TRIGGERING_ACTOR" | tr '[:upper:]' '[:lower:]')"
          entries=0
          authorized=0

          # Exact match per entry. A substring test would authorize any actor
          # whose username is a fragment of an authorized one. GitHub
          # usernames are case-insensitive, so both sides are lowercased.
          while IFS= read -r entry; do
            entry="$(printf '%s' "$entry" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            [ -z "$entry" ] && continue
            entries=$((entries + 1))
            if [ "$entry" = "$actor" ]; then authorized=1; fi
          done <<EOF
          $(printf '%s' "${AUTHORIZED_USERS:-}" | tr ',' '\n')
          EOF

          if [ "$entries" -eq 0 ]; then
            echo "::error title=Releases are not configured::The DEPLOYMENT_AUTHORIZED_USERS secret is unset or contains no usernames, so nobody can release. Set it on the repository or the organization to a comma-separated list of GitHub usernames."
            exit 1
          fi

          if [ "$authorized" -ne 1 ]; then
            echo "::error title=Not authorized to release::$TRIGGERING_ACTOR is not one of the $entries accounts in DEPLOYMENT_AUTHORIZED_USERS. Ask a listed maintainer to run this workflow, or to add you to the secret."
            exit 1
          fi

          echo "$TRIGGERING_ACTOR is authorized to release."

  release:
    name: release
    needs: check_authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release walks history back to the last tag.
          fetch-depth: 0
          persist-credentials: false
      - name: semantic-release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        id: semver
        with:
          # Pin what actually runs. Left unset, the action installs the latest
          # semantic-release, so the version in devDependencies would no longer
          # govern releases.
          semantic_version: 25.0.9
          # The action pre-installs only what is listed here. commit-analyzer,
          # release-notes-generator, npm and github ship inside
          # semantic-release itself; these two do not, and .releaserc.json
          # needs them. Keep the versions in step with devDependencies.
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.LIBREBOT_ACCESS_TOKEN }}
          GIT_AUTHOR_NAME: libretexts-bot
          GIT_AUTHOR_EMAIL: dev@libretexts.org
          GIT_COMMITTER_NAME: libretexts-bot
          GIT_COMMITTER_EMAIL: dev@libretexts.org
