name: Release New Version

on: workflow_dispatch

concurrency:
  group: release
  cancel-in-progress: false

# The release itself authenticates with LIBREBOT_ACCESS_TOKEN, not with
# GITHUB_TOKEN, so that the tag and the CHANGELOG commit can pass a protected
# main. These permissions only scope the automatic GITHUB_TOKEN; contents:
# write is kept so nothing here depends on the repository default.
permissions:
  contents: write

jobs:
  check_authorization:
    name: Check authorization to release new version
    runs-on: ubuntu-latest
    outputs:
      isAuthorized: ${{ steps.check-auth.outputs.is_authorized }}
    steps:
      - name: check-auth
        id: check-auth
        run: echo "is_authorized=${{ contains(secrets.DEPLOYMENT_AUTHORIZED_USERS, github.triggering_actor) }}" >> $GITHUB_OUTPUT
  release:
    name: release
    needs: check_authorization
    if: needs.check_authorization.outputs.isAuthorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release walks history back to the last tag.
          fetch-depth: 0
          persist-credentials: false
      - name: semantic-release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        id: semver
        with:
          # Pin what actually runs. Left unset, the action installs the latest
          # semantic-release, so the version in devDependencies would no longer
          # govern releases.
          semantic_version: 25.0.9
          # The action pre-installs only what is listed here. commit-analyzer,
          # release-notes-generator, npm and github ship inside
          # semantic-release itself; these two do not, and .releaserc.json
          # needs them. Keep the versions in step with devDependencies.
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.LIBREBOT_ACCESS_TOKEN }}
          GIT_AUTHOR_NAME: libretexts-bot
          GIT_AUTHOR_EMAIL: dev@libretexts.org
          GIT_COMMITTER_NAME: libretexts-bot
          GIT_COMMITTER_EMAIL: dev@libretexts.org
